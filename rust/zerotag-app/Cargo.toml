[package]
name = "zerotag-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZeroTag application for the CardputerZero (Rust port)"

[[bin]]
name = "zerotag"
path = "src/main.rs"

[dependencies]
zerotag-core = { path = "../zerotag-core" }
zerotag-ui = { path = "../zerotag-ui" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"
